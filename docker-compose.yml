services:
  fhir-backend-jpaserver-start:
    image: ghcr.io/ohsu-octri/fhir-sandbox-backend
    container_name: fhir-backend-jpaserver-start
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://fhir-backend-postgres:5432/hapi"
      SPRING_DATASOURCE_USERNAME: "admin"
      SPRING_DATASOURCE_PASSWORD: "admin"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
      HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
    ports:
      - "8080:8080"
      - "8000:8000"
    volumes:
      - ./target/ROOT.war:/app.jar
    # Uncomment to enable periodic health checks.
    # Can also be run manually: docker exec fhir-backend-jpaserver-start java -cp /app HealthCheck
    # healthcheck:
    #   test: ["CMD", "java", "-cp", "/app", "HealthCheck"]
    #   interval: 30s
    #   timeout: 10s
    #   start_period: 60s
    #   retries: 3
    depends_on:
      fhir-backend-postgres:
        condition: service_healthy
  fhir-backend-postgres:
    image: postgres:16-alpine
    container_name: fhir-backend-postgres
    restart: always
    ports:
      - "5432:5432"
      - "55432:55432"
    environment:
      POSTGRES_DB: "hapi"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin"
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U admin -d hapi' || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    volumes:
      - ./docker_data/postgres:/var/lib/postgresql/data
