apiVersion: apps/v1
kind: Deployment
metadata:
  name: fhir-sandbox-backend-stage
  labels:
    app: fhir-sandbox-backend-stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fhir-sandbox-backend-stage
  template:
    metadata:
      labels:
        app: fhir-sandbox-backend-stage
      annotations:
        co.elastic.logs/multiline.type: pattern
        co.elastic.logs/multiline.pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}
        co.elastic.logs/multiline.negate: 'true'
        co.elastic.logs/multiline.match: after
        co.elastic.logs/processors.dissect.tokenizer: '%{+@timestamp} %{log.level} %{process.pid|long} --- [%{process.thread.name}] %{log.logger} : %{}'
        co.elastic.logs/processors.dissect.ignore_failure: 'true'
        co.elastic.logs/processors.dissect.trim_values: all
        co.elastic.logs/processors.dissect.target_prefix: ''
        co.elastic.logs/processors.dissect.overwrite_keys: 'true'
        prometheus.io/scrape: 'true'
        prometheus.io/path: /fhir-sandbox-backend/actuator/prometheus
        prometheus.io/port: '8080'
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 5333
        runAsGroup: 5333
        fsGroup: 5333
      containers:
        - name: fhir-sandbox-backend
          image: ghcr.io/ohsu-octri/fhir-sandbox-backend:0.3.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              memory: 512Mi
              cpu: 50m
            limits:
              memory: 4Gi
              cpu: 2000m
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fhir-sandbox-backend-stage
            - secretRef:
                name: fhir-sandbox-backend-stage
          volumeMounts:
            - name: config-files
              mountPath: /config
              readOnly: true
      volumes:
        - name: config-files
          configMap:
            name: fhir-sandbox-backend-stage
            items:
              - key: application.properties
                path: application.properties
      imagePullSecrets:
        - name: ghcr-registry-cred
