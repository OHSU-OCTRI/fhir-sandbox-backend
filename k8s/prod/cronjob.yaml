---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fhir-sandbox-postgres-backup-prod
  labels:
    app: fhir-sandbox-postgres-backup-prod
spec:
  schedule: "19 03 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: fhir-sandbox-postgres-backup-prod
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 5333
            runAsGroup: 5333
            runAsNonRoot: true
            runAsUser: 5333
          containers:
          - name: postgres-backup
            image: postgres:16
            command:
            - sh
            - -c
            - pg_dump -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -f /data/hapi-`date "+%FT%T"`.sql
            imagePullPolicy: IfNotPresent
            resources:
              requests:
                memory: 256Mi
                cpu: 50m
              limits:
                memory: 512Mi
                cpu: 500m
            env:
            # Makes pg_dump use the password file in the NFS mount
            # NOTE: will need to change if POSTGRES_PASSWORD is rotated
            - name: PGPASSFILE
              value: /data/pgpass
            - name: POSTGRES_HOST
              value: fhir-sandbox-postgres-prod
            envFrom:
            - secretRef:
                name: fhir-sandbox-postgres-prod
            volumeMounts:
            - name: octrikube-nfs
              mountPath: /data
              subPath: fhir-sandbox-postgres-prod
          volumes:
          - name: octrikube-nfs
            persistentVolumeClaim:
              claimName: octrikube-nfs
          imagePullSecrets:
          - name: octri-registry-cred