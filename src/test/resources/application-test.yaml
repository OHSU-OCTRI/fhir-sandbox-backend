hapi:
  fhir:
    fhir_version: R4
    advanced_lucene_indexing: false
    search_index_full_text_enabled: false
    mdm_enabled: false

spring:
  datasource:
    url: jdbc:h2:mem:test_mem
    username: sa
    password: null
    driver-class-name: org.h2.Driver

  jpa:
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:ca.uhn.fhir.jpa.model.dialect.HapiFhirH2Dialect}
