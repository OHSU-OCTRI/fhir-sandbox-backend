---
name: Build and publish
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build-java-source:
    name: Build jar and test
    uses: OHSU-OCTRI/shared-workflows/.github/workflows/java-build.yaml@main
    with:
      java_version: '17'
      publish_to_github_packages: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
    secrets: inherit

  build-container-image:
    name: Build container image
    needs: build-java-source
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    uses: OHSU-OCTRI/shared-workflows/.github/workflows/container-image-build.yaml@main
    with:
      artifact_name: ${{ github.sha }}-jar
      artifact_path: target
    secrets: inherit
